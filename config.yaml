database:
  source:
    host: ${DB_PROD_HOST}
    user: ${DB_PROD_USER}
    password: ${DB_PROD_PASSWORD}
    database: ${DB_PROD_NAME}
    port: ${DB_PROD_PORT}
  target:
    host: ${DB_DEV_HOST}
    user: ${DB_DEV_USER}
    password: ${DB_DEV_PASSWORD}
    database: ${DB_DEV_NAME}
    port: ${DB_DEV_PORT}

model:
  path: "model/model_optimized.pkl"
  version: "v1.1"

execution:
  lookback_hours: 168
  lookback_days_maintenance: 60
  timeout_minutes: 120
  prediction_mode: "hourly"
  prediction_hours_ahead: 1  # 

predictions:
  table_name: "bui_predicciones_hora"

logging:
  level: INFO
  console: true
  file: true
  log_dir: logs/
